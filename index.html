<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://qbsovyjwnxmryokekypf.supabase.co; img-src https://*.supabase.co data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>AI News by Carni — Review</title>
  <style>
    :root{--bg:#07101d;--card:#0b1727;--line:#233b57;--text:#f4f7fb;--muted:#93a4ba;--cyan:#42b7ff;--green:#58d9ac;--red:#ff7b86}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    button{font:inherit}.boot{max-width:620px;margin:20vh auto 0;padding:22px;text-align:center}.bad{color:var(--red)}.muted{color:var(--muted);font-size:13px}
    .portal{max-width:1050px;margin:0 auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{font-size:18px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:4px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:12px}.hero h1{font-size:22px;margin:0 0 6px}.btn{border:1px solid #315276;background:#10223a;color:#eef7ff;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:800}.btn:hover{border-color:var(--cyan)}.btn.primary{background:#123b55;border-color:#2b83b7}.btn.green{border-color:#347d67;background:#10352e}.btn:disabled{opacity:.55;cursor:default}
    .pair{max-width:560px;margin:14vh auto 0;text-align:center}.pairCode{font-size:48px;letter-spacing:.16em;font-weight:950;margin:18px 0;color:#fff}.pairHint{line-height:1.55;color:var(--muted)}.hidden{display:none!important}
    .queue{display:grid;gap:10px;margin-top:12px}.queueItem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px;border:1px solid #29445f;border-radius:12px;background:#091421}.queueTitle{font-size:16px;font-weight:900;line-height:1.25}.queueMeta{font-size:12px;color:var(--muted);margin-top:6px}.queueStage{display:inline-block;border:1px solid #35516f;border-radius:999px;padding:3px 8px;font-size:11px;color:#bdd0e5;margin-left:6px}.slotBadge{display:inline-block;border:1px solid #2d5d7b;border-radius:999px;padding:3px 8px;font-size:11px;color:#9fdcff;margin-left:6px}.slotBadge.evening{border-color:#6b5985;color:#d8c4ff}.queueItem.human{border-color:#3a8bc1;background:#0a1827}.queueItem.human .queueStage{color:#fff}.queueAction{display:flex;gap:7px;align-items:center;justify-content:flex-end}.queueHint{font-size:11px;color:var(--muted);white-space:nowrap}.quiet{color:var(--muted);font-size:12px}.doneLine{padding:10px 2px 0;color:var(--muted);font-size:12px}.archive{margin-top:14px}.archive summary{cursor:pointer;color:var(--muted);font-size:12px}.archive .queue{margin-top:10px}.archive .queueItem{padding:10px 12px;opacity:.82}.archive .queueTitle{font-size:13px}
    .editorial{max-width:900px;margin:0 auto}.editorialHead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.editorialTitle{font-size:24px;font-weight:950;line-height:1.2;margin:0}.editorialMeta{font-size:12px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}.beats{display:grid;gap:8px;margin-top:12px}.beatCard{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;padding:11px 12px;border:1px solid #213b56;border-radius:10px;background:#08131f}.beatNo{width:28px;height:28px;border:1px solid #315276;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#9fdbff}.beatText{font-size:16px;font-weight:850;line-height:1.3}.editorialActions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}.hash{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#8098b0;word-break:break-all;margin-top:12px}.decisionState{margin-top:10px;font-size:13px}.sourceLine{margin-top:12px;color:var(--muted);font-size:12px}
    .analytics{display:grid;gap:12px}.analyticsKpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.kpi{background:#091421;border:1px solid #1e354f;border-radius:12px;padding:13px}.kpiValue{font-size:24px;font-weight:950}.kpiLabel{font-size:11px;color:var(--muted);margin-top:5px}.ageBtns{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.ageBtn{border:1px solid #315276;background:#10223a;color:#d7e4f2;border-radius:9px;padding:7px 11px;cursor:pointer;font-weight:850}.ageBtn.active{border-color:var(--cyan);color:#fff}.bars{display:grid;gap:8px}.barRow{display:grid;grid-template-columns:minmax(160px,300px) minmax(150px,1fr) 90px;gap:10px;align-items:center}.barName{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barTrack{height:18px;background:#06101c;border:1px solid #1e354f;border-radius:999px;overflow:hidden}.barFill{height:100%;background:linear-gradient(90deg,#258bcf,#62d8ff)}.barValue{text-align:right;font-weight:900}.tableWrap{overflow:auto;border:1px solid #1e354f;border-radius:10px}.analyticsTable{width:100%;border-collapse:collapse;min-width:780px}.analyticsTable th,.analyticsTable td{padding:8px 9px;border-bottom:1px solid #1c3048;text-align:right;font-size:12px;white-space:nowrap}.analyticsTable th{background:#0c192a;color:#9fb1c7}.analyticsTable th:first-child,.analyticsTable td:first-child{text-align:left;white-space:normal;min-width:220px}.signals{display:grid;gap:8px}.signal{border:1px solid #29425f;border-radius:10px;padding:10px 12px;background:#091522;font-size:13px;line-height:1.45}.signal.warn{border-color:#6a5124}.signal.good{border-color:#245b49}
    @media(max-width:900px){.analyticsKpis{grid-template-columns:repeat(2,minmax(0,1fr))}.barRow{grid-template-columns:minmax(110px,180px) 1fr 70px}}
    @media(max-width:650px){.hero,.queueItem{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.pairCode{font-size:38px}.analyticsKpis{grid-template-columns:1fr 1fr}.barRow{grid-template-columns:1fr}.barValue{text-align:left}.barName{white-space:normal}}
  </style>
</head>
<body>
  <div id="app"><div class="boot"><b>AI NEWS BY CARNI · REVIEW</b><p id="bootStatus" class="muted">Открываю…</p></div></div>
  <script>
  (async()=>{
    const SUPABASE='https://qbsovyjwnxmryokekypf.supabase.co/functions/v1';
    const gateway=SUPABASE+'/shorts-storyboard-api';
    const portalApi=SUPABASE+'/shorts-review-portal';
    const portalKey='carniReviewPortalToken';
    const pairingIdKey='carniReviewPairingId';
    const pairingCodeKey='carniReviewPairingCode';
    const app=document.getElementById('app');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusName=s=>({editing:'редактирование',approved:'одобрено',preview_ready:'preview готов',preview_requested:'preview в очереди',preview_claimed:'рендерится'})[String(s||'')]||String(s||'—');
    const queueActionHtml=q=>{
      if(q.action==='storyboard'&&q.sessionId)return '<button class="btn primary" data-open-session="'+esc(q.sessionId)+'">Открыть</button>';
      if(q.action==='text')return '<button class="btn primary" data-open-editorial="'+Number(q.textReviewId||0)+'">Открыть</button>';
      if(q.action==='video')return '<div class="queueHint">Telegram</div>';
      return '';
    };
    const slotBadge=q=>q.publicationSlot?'<span class="slotBadge '+(q.publicationSlot==='evening'?'evening':'')+'">'+(q.publicationSlot==='evening'?'Вечер':'День')+'</span>':'';
    const queueCard=q=>'<div class="queueItem '+(q.needsHuman?'human':'')+'"><div><div class="queueTitle">'+esc(q.title||q.shortId||'Short')+slotBadge(q)+' <span class="queueStage">'+esc(q.stageLabel||q.stage||'—')+'</span></div><div class="queueMeta">'+esc(q.reportDate||'')+(q.videoReviewId?' · VID-'+String(q.videoReviewId).padStart(4,'0'):'')+'</div></div><div class="queueAction">'+queueActionHtml(q)+'</div></div>';

    async function openSession(query){
      const session=(query.get('session')||'').trim().toLowerCase();
      const portalMode=query.get('portal')==='1';
      const hash=new URLSearchParams(location.hash.replace(/^#/,''));
      const lab=query.get('lab')==='1'||hash.get('lab')==='1';
      if(!/^[0-9a-f-]{36}$/i.test(session)) throw new Error('Некорректная ссылка на сессию');

      const incoming=(hash.get('token')||'').trim().toLowerCase();
      const tokenKey='carniStoryboardToken:'+location.pathname;
      if(incoming&&!portalMode){
        if(!/^[0-9a-f]{64}$/i.test(incoming)) throw new Error('Некорректный ключ доступа');
        sessionStorage.setItem(tokenKey,incoming);
        history.replaceState({},'',location.pathname+'?'+query.toString());
      }

      if(portalMode){
        const portalToken=localStorage.getItem(portalKey)||'';
        if(!/^[0-9a-f]{64}$/i.test(portalToken)) {
          location.href=location.pathname;
          return;
        }
      }else{
        const token=sessionStorage.getItem(tokenKey)||'';
        if(!/^[0-9a-f]{64}$/i.test(token)) {
          throw new Error('Ключ доступа отсутствует или устарел. Открой свежую ссылку из Telegram или зайди через главную review.carni.ltd.');
        }
      }

      app.innerHTML='<div class="boot"><b>AI NEWS BY CARNI · STORYBOARD</b><p id="bootStatus" class="muted">Открываю редактор…</p></div>';
      const status=document.getElementById('bootStatus');
      const templateGateway=lab?SUPABASE+'/shorts-storyboard-editor-lab':gateway;
      if(lab) status.textContent='Открываю UX-прототип…';
      const response=await fetch(templateGateway+'/template?session='+encodeURIComponent(session),{cache:'no-store'});
      if(!response.ok) throw new Error('Не удалось загрузить интерфейс: HTTP '+response.status);
      let editorHtml=new TextDecoder('utf-8').decode(await response.arrayBuffer());

      const oldBase="const base=()=>location.pathname.replace(/\\/$/,'');";
      const apiBase=gateway+'/s/'+session;
      const newBase='const base=()=>'+JSON.stringify(apiBase)+';';
      if(!editorHtml.includes(oldBase)) throw new Error('Версия интерфейса несовместима с оболочкой review.carni.ltd');
      editorHtml=editorHtml.replace(oldBase,newBase);
      editorHtml=editorHtml.replace(
        '<head>',
        '<head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src https://*.supabase.co data:; connect-src https://qbsovyjwnxmryokekypf.supabase.co; style-src \'unsafe-inline\'; script-src \'unsafe-inline\'; base-uri \'none\'; form-action \'none\'">'
      );
      document.open();document.write(editorHtml);document.close();
    }

    function renderPair(){
      app.innerHTML='<div class="portal"><div class="pair card"><div class="brand">AI NEWS BY CARNI · REVIEW</div><h1>Постоянный вход</h1><div class="pairHint">Один раз привяжем этот браузер. После этого <b>review.carni.ltd</b> будет открываться напрямую — без Telegram-ссылок.</div><div id="pairIdle"><button class="btn primary" id="pairStart" style="margin-top:18px">Привязать этот браузер</button></div><div id="pairWait" class="hidden"><div class="pairCode" id="pairCode"></div><div class="pairHint">Пришли этот шестизначный код Чатику. Код живёт 10 минут.<br><span id="pairState">Жду подтверждения…</span></div></div><div id="pairError" class="bad" style="margin-top:12px"></div></div></div>';
      document.getElementById('pairStart').onclick=startPairing;
    }

    async function startPairing(){
      const btn=document.getElementById('pairStart'),err=document.getElementById('pairError');
      btn.disabled=true;err.textContent='';
      try{
        const r=await fetch(portalApi+'/pair/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deviceName:'Vivaldi · review.carni.ltd'})});
        const j=await r.json();
        if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
        localStorage.setItem(pairingIdKey,String(j.pairingId));
        localStorage.setItem(pairingCodeKey,String(j.code));
        document.getElementById('pairIdle').classList.add('hidden');
        document.getElementById('pairWait').classList.remove('hidden');
        document.getElementById('pairCode').textContent=j.code;
        pollPairing(j.pairingId);
      }catch(e){btn.disabled=false;err.textContent=e.message||String(e)}
    }

    async function pollPairing(id){
      const state=document.getElementById('pairState');
      while(true){
        await new Promise(r=>setTimeout(r,1800));
        try{
          const r=await fetch(portalApi+'/pair/status?id='+encodeURIComponent(id),{cache:'no-store'});
          const j=await r.json();
          if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
          if(j.status==='claimed'&&/^[0-9a-f]{64}$/i.test(j.token||'')){
            localStorage.setItem(portalKey,String(j.token).toLowerCase());
            localStorage.removeItem(pairingIdKey);
            localStorage.removeItem(pairingCodeKey);
            state.textContent='Готово. Открываю портал…';
            await loadHome();
            return;
          }
          if(j.status==='approved')state.textContent='Подтверждено · создаю доступ…';
          else if(j.status==='expired'){localStorage.removeItem(pairingIdKey);localStorage.removeItem(pairingCodeKey);state.textContent='Код истёк. Нажми «Привязать этот браузер» ещё раз.';return}
        }catch(e){state.textContent='Ошибка проверки: '+(e.message||String(e));return}
      }
    }

    const aInt=v=>v===null||v===undefined?'ещё нет':Math.round(Number(v)).toLocaleString('ru-RU');
    const aOne=v=>v===null||v===undefined?'ждём':Number(v).toFixed(1);
    const aPct=v=>v===null||v===undefined?'ждём':Number(v).toFixed(1)+'%';
    const aAge=v=>{if(v===null||v===undefined)return'—';const n=Number(v);return n<24?n.toFixed(1)+' ч':(n/24).toFixed(1)+' д'};
    const aSlot=v=>({morning:'утро',day:'день',evening:'вечер',night:'ночь'})[String(v||'')]||'—';
    const aDate=v=>{if(!v)return'—';try{return new Date(v).toLocaleString('ru-RU',{timeZone:'Asia/Aqtobe',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return String(v)}};

    async function portalGet(path){
      const token=localStorage.getItem(portalKey)||'';
      if(!/^[0-9a-f]{64}$/i.test(token)) throw new Error('Браузер не привязан');
      const r=await fetch(portalApi+path,{headers:{'x-review-portal-token':token},cache:'no-store'});
      const j=await r.json().catch(()=>({}));
      if(r.status===401){localStorage.removeItem(portalKey);throw new Error('Доступ браузера истёк')}
      if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      return j;
    }

    async function portalPost(path,body){
      const token=localStorage.getItem(portalKey)||'';
      if(!/^[0-9a-f]{64}$/i.test(token)) throw new Error('Браузер не привязан');
      const r=await fetch(portalApi+path,{
        method:'POST',
        headers:{'content-type':'application/json','x-review-portal-token':token},
        body:JSON.stringify(body||{}),
        cache:'no-store'
      });
      const j=await r.json().catch(()=>({}));
      if(r.status===401){localStorage.removeItem(portalKey);throw new Error('Доступ браузера истёк')}
      if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      return j;
    }

    function analyticsName(data,videoId,shortId){
      const v=(data.videos||[]).find(x=>x.videoId===videoId);
      return String(v?.title||shortId||videoId||'Short');
    }

    function renderAnalytics(data,selectedAge){
      const o=data.overview||{},ch=data.channel||{},count=Number(o.trackedPublicShorts||0),ret=Number(o.processedRetentionVideos||0);
      const rows=(data.milestones||[]).filter(x=>Number(x.milestoneHours)===selectedAge&&x.views!==null).sort((a,b)=>Number(b.views)-Number(a.views));
      const max=Math.max(...rows.map(x=>Number(x.views||0)),1);
      const map=new Map();
      for(const r of data.milestones||[]){if(!map.has(r.videoId))map.set(r.videoId,{});map.get(r.videoId)[r.milestoneHours]=r}
      const ids=[...new Set((data.milestones||[]).map(x=>x.videoId))];

      const signals=[];
      if(count<8)signals.push({c:'warn',t:'Выборка пока маленькая',d:'Сейчас отслеживается '+count+' реальных Shorts. Это ранние сигналы, а не устойчивые правила.'});
      if(ret<count)signals.push({c:'warn',t:'Retention ещё дозревает',d:'Глубокие метрики доступны для '+ret+' из '+count+' роликов. YouTube Analytics приходит с задержкой.'});
      const r24=(data.milestones||[]).filter(x=>Number(x.milestoneHours)===24&&x.views!==null).sort((a,b)=>Number(a.views)-Number(b.views));
      if(r24.length>=2)signals.push({c:'good',t:'24-часовые срезы уже сравнимы',d:'Диапазон сейчас '+aInt(r24[0].views)+'–'+aInt(r24[r24.length-1].views)+' просмотров. Причину разницы пока не приписываем одному фактору.'});
      if(!signals.length)signals.push({c:'good',t:'База уже пригодна для наблюдений',d:'Можно искать повторяющиеся паттерны, но не объявлять причинность без дополнительной проверки.'});

      app.innerHTML='<div class="portal analytics"><div class="top"><div><div class="brand">AI NEWS BY CARNI · ANALYTICS</div><div class="sub">Сравнение Shorts по одинаковому возрасту · сбор каждые '+esc(data.source?.collectorCadenceHours||6)+'ч</div></div><button class="btn" id="analyticsHome">На главную</button></div>'+
      '<div class="analyticsKpis">'+[
        ['Подписчики',aInt(ch.subscribers)],
        ['Публичные Shorts',aInt(count)],
        ['Просмотры Shorts',aInt(o.currentViews)],
        ['Retention',ret+' / '+count],
        ['Снимок',aDate(data.source?.latestSnapshotAt)]
      ].map(x=>'<div class="kpi"><div class="kpiValue">'+esc(x[1])+'</div><div class="kpiLabel">'+esc(x[0])+'</div></div>').join('')+'</div>'+
      '<section class="card"><b>Сравнение по одинаковому возрасту</b><div class="ageBtns">'+[6,24,72,168].map(h=>'<button class="ageBtn '+(h===selectedAge?'active':'')+'" data-age="'+h+'">'+h+'ч</button>').join('')+'</div><div class="bars">'+(rows.length?rows.map(r=>'<div class="barRow"><div class="barName" title="'+esc(analyticsName(data,r.videoId,r.shortId))+'">'+esc(analyticsName(data,r.videoId,r.shortId))+'</div><div class="barTrack"><div class="barFill" style="width:'+Math.max(2,Math.round(Number(r.views||0)/max*100))+'%"></div></div><div class="barValue">'+aInt(r.views)+'</div></div>').join(''):'<div class="muted">Для '+selectedAge+'ч ещё нет зрелых срезов.</div>')+'</div></section>'+
      '<section class="card"><b>Возрастные срезы · просмотры</b><div class="tableWrap" style="margin-top:10px"><table class="analyticsTable"><thead><tr><th>Short</th><th>6ч</th><th>24ч</th><th>72ч</th><th>168ч</th></tr></thead><tbody>'+(
        ids.length?ids.map(id=>{const rs=map.get(id)||{},sample=Object.values(rs)[0]||{};return '<tr><td>'+esc(analyticsName(data,id,sample.shortId))+'</td>'+[6,24,72,168].map(h=>'<td>'+aInt(rs[h]?.views)+'</td>').join('')+'</tr>'}).join(''):'<tr><td colspan="5" class="muted">Срезов пока нет.</td></tr>'
      )+'</tbody></table></div></section>'+
      '<section class="card"><b>Текущее состояние Shorts</b><div class="tableWrap" style="margin-top:10px"><table class="analyticsTable"><thead><tr><th>Short</th><th>Возраст</th><th>Просмотры</th><th>Скорость</th><th>Avg %</th><th>Avg sec</th><th>Лайки</th><th>Публикация</th></tr></thead><tbody>'+(
        (data.videos||[]).length?(data.videos||[]).map(r=>'<tr><td><b>'+esc(r.title||r.shortId)+'</b><div class="muted">'+esc(r.storyShape||'')+(r.template?' · '+esc(r.template):'')+'</div></td><td>'+aAge(r.ageHours)+'</td><td><b>'+aInt(r.views)+'</b></td><td>'+((r.viewsPerHour===null||r.viewsPerHour===undefined)?'ждём':aOne(r.viewsPerHour)+'/ч')+'</td><td>'+aPct(r.averageViewPercentage)+'</td><td>'+((r.averageViewDuration===null||r.averageViewDuration===undefined)?'ждём':aOne(r.averageViewDuration)+'с')+'</td><td>'+aInt(r.likes)+'</td><td>'+esc((r.publicationLocalLabel||'—')+' · '+aSlot(r.publicationSlot))+'</td></tr>').join(''):'<tr><td colspan="8" class="muted">Опубликованных Shorts пока нет.</td></tr>'
      )+'</tbody></table></div></section>'+
      '<section class="card"><b>Что реально видно из данных</b><div class="signals" style="margin-top:10px">'+signals.map(s=>'<div class="signal '+s.c+'"><b>'+esc(s.t)+'</b><br>'+esc(s.d)+'</div>').join('')+'</div></section></div>';

      document.getElementById('analyticsHome').onclick=()=>location.href=location.pathname;
      document.querySelectorAll('[data-age]').forEach(n=>n.onclick=()=>renderAnalytics(data,Number(n.dataset.age)));
    }

    async function loadAnalytics(){
      app.innerHTML='<div class="boot"><b>AI NEWS BY CARNI · ANALYTICS</b><p class="muted">Загружаю данные…</p></div>';
      try{
        const data=await portalGet('/analytics');
        renderAnalytics(data,24);
      }catch(e){
        if(String(e.message||e).includes('не привязан')||String(e.message||e).includes('истёк')){location.href=location.pathname;return}
        app.innerHTML='<div class="boot"><b>AI NEWS BY CARNI · ANALYTICS</b><p class="bad">'+esc(e.message||String(e))+'</p><p><button class="btn" id="analyticsBack">На главную</button></p></div>';
        document.getElementById('analyticsBack').onclick=()=>location.href=location.pathname;
      }
    }

    async function loadEditorial(reviewId){
      const data=await portalGet('/editorial?reviewId='+encodeURIComponent(reviewId));
      const r=data.review||{};
      const beats=Array.isArray(r.beats)?r.beats:[];
      const revLabel='REV-'+String(r.reviewId||0).padStart(4,'0');
      app.innerHTML='<div class="editorial"><div class="editorialHead"><div><div class="brand">AI NEWS BY CARNI · REVIEW</div><div class="sub">Согласование текста</div></div><a class="btn" href="'+location.pathname+'">← Назад</a></div>'+
        '<div class="card"><h1 class="editorialTitle">'+esc(r.title||r.shortId||'Short')+(r.publicationSlot?'<span class="slotBadge '+(r.publicationSlot==='evening'?'evening':'')+'">'+(r.publicationSlot==='evening'?'Вечер':'День')+'</span>':'')+'</h1>'+
        '<div class="editorialMeta">'+esc(r.reportDate||'')+' · '+esc(revLabel)+'</div>'+
        (r.thesis?'<div class="sourceLine">'+esc(r.thesis)+'</div>':'')+
        '<div class="beats">'+beats.map(b=>'<div class="beatCard"><div class="beatNo">'+Number(b.index||0)+'</div><div class="beatText">'+esc(b.headline||'')+'</div></div>').join('')+'</div>'+
        (r.source?.sectionTitle?'<div class="sourceLine">Источник: '+esc(r.source.sectionTitle)+'</div>':'')+
        '<div class="hash">Candidate SHA-256 · '+esc(r.candidateSha256||'')+'</div>'+
        (r.canDecide?'<div class="editorialActions"><button class="btn primary" id="sendReviewer">Исправить в Ревьюере</button><button class="btn green" id="approveExact">Одобрить как есть</button></div>':'<div class="decisionState">Это согласование уже обработано.</div>')+
        '<div class="decisionState" id="decisionState"></div></div></div>';

      if(!r.canDecide)return;
      const act=async(decision)=>{
        const approve=decision==='approve';
        const message=approve?'Одобрить именно эту версию текста?':'Передать именно эту версию текста в Ревьюер?';
        if(!confirm(message))return;
        const buttons=[document.getElementById('approveExact'),document.getElementById('sendReviewer')];
        buttons.forEach(b=>{if(b)b.disabled=true});
        const state=document.getElementById('decisionState');
        if(state)state.textContent='Сохраняю решение…';
        try{
          await portalPost('/editorial/decision',{
            reviewId:Number(r.reviewId),
            decision,
            candidateSha256:String(r.candidateSha256||'')
          });
          if(state)state.textContent=approve?'Одобрено. Производственный путь запущен.':'Передано в Ревьюер.';
          setTimeout(()=>{location.href=location.pathname},900);
        }catch(e){
          buttons.forEach(b=>{if(b)b.disabled=false});
          if(state){state.classList.add('bad');state.textContent=e.message||String(e)}
        }
      };
      document.getElementById('approveExact').onclick=()=>act('approve');
      document.getElementById('sendReviewer').onclick=()=>act('reviewer');
    }

    async function loadHome(){
      const token=localStorage.getItem(portalKey)||'';
      if(!/^[0-9a-f]{64}$/i.test(token)){
        const pairingId=localStorage.getItem(pairingIdKey)||'';
        const pairingCode=localStorage.getItem(pairingCodeKey)||'';
        if(/^[0-9a-f-]{36}$/i.test(pairingId)){
          renderPair();
          document.getElementById('pairIdle').classList.add('hidden');
          document.getElementById('pairWait').classList.remove('hidden');
          document.getElementById('pairCode').textContent=/^[0-9]{6}$/.test(pairingCode)?pairingCode:'••••••';
          document.getElementById('pairState').textContent='Продолжаю уже начатую привязку…';
          pollPairing(pairingId);
          return;
        }
        renderPair();return
      }
      let r,j;
      try{
        r=await fetch(portalApi+'/home',{headers:{'x-review-portal-token':token},cache:'no-store'});
        j=await r.json();
      }catch(e){app.innerHTML='<div class="boot bad">Не удалось открыть портал: '+esc(e.message||String(e))+'</div>';return}
      if(r.status===401){localStorage.removeItem(portalKey);renderPair();return}
      if(!r.ok||!j.ok){app.innerHTML='<div class="boot bad">Ошибка портала: '+esc(j.error||('HTTP '+r.status))+'</div>';return}

      const queue=Array.isArray(j.queue)?j.queue:[];
      const analyticsHref='?view=analytics';
      const now=Date.now();
      const ageHours=q=>Math.max(0,(now-new Date(q.updatedAt||0).getTime())/3600000);
      const terminal=new Set(['published','video_rejected','text_rejected']);
      const current=queue.filter(q=>{
        if(ageHours(q)>72)return false;
        return !terminal.has(String(q.stage||''));
      });
      const recentDone=queue.find(q=>q.stage==='published')||null;
      const hidden=queue.filter(q=>!current.includes(q)).slice(0,12);

      app.innerHTML='<div class="portal"><div class="top"><div><div class="brand">AI NEWS BY CARNI · REVIEW</div><div class="sub">Контрольный центр Shorts</div></div><div style="display:flex;gap:8px"><button class="btn green" id="openAnalytics">Analytics</button><button class="btn" id="disconnect">⋯</button></div></div>'+
      '<div class="card"><b>Сейчас</b><div class="sub">Только то, что требует решения или ещё не закончено.</div><div class="queue">'+(
        current.length?current.map(queueCard).join(''):'<div class="quiet">Ничего не ждёт твоего решения.</div>'
      )+'</div>'+(
        recentDone?'<div class="doneLine">Последний выпуск · '+esc(recentDone.title||recentDone.shortId)+' · опубликован</div>':''
      )+'</div>'+(
        hidden.length?'<details class="archive"><summary>Показать старые и завершённые · '+hidden.length+'</summary><div class="queue">'+hidden.map(queueCard).join('')+'</div></details>':''
      )+'</div>';
      document.getElementById('disconnect').onclick=()=>{if(confirm('Отвязать этот браузер от внутреннего Reviewer?')){localStorage.removeItem(portalKey);localStorage.removeItem(pairingIdKey);localStorage.removeItem(pairingCodeKey);location.href=location.pathname}};
      document.getElementById('openAnalytics').onclick=()=>location.href=analyticsHref;
      document.querySelectorAll('[data-open-session]').forEach(n=>n.onclick=()=>{location.href='?session='+encodeURIComponent(n.dataset.openSession)+'&portal=1'});
      document.querySelectorAll('[data-open-editorial]').forEach(n=>n.onclick=()=>{location.href='?editorial='+encodeURIComponent(n.dataset.openEditorial)});
    }

    try{
      const query=new URLSearchParams(location.search);
      if(query.get('view')==='analytics')await loadAnalytics();
      else if(query.get('editorial'))await loadEditorial(query.get('editorial'));
      else if(query.get('session'))await openSession(query);
      else await loadHome();
    }catch(error){
      app.innerHTML='<div class="boot"><b>AI NEWS BY CARNI · REVIEW</b><p class="bad">'+esc(error instanceof Error?error.message:String(error))+'</p><p><a class="btn" href="'+location.pathname+'">На главную</a></p></div>';
    }
  })();
  </script>
</body>
</html>
