<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://qbsovyjwnxmryokekypf.supabase.co; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>AI News by Carni — Storyboard Review</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07101d;color:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .boot{max-width:520px;margin:20vh auto 0;padding:22px;text-align:center}
    .bad{color:#ff9ba3}.muted{color:#93a4ba;font-size:13px}
  </style>
</head>
<body>
  <div class="boot">
    <b>AI NEWS BY CARNI · STORYBOARD</b>
    <p id="status" class="muted">Открываю мобильный редактор…</p>
  </div>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try{
      const query=new URLSearchParams(location.search);
      const session=(query.get('session')||'').trim().toLowerCase();
      if(!/^[0-9a-f-]{36}$/i.test(session)) throw new Error('Некорректная ссылка на сессию');

      const hash=new URLSearchParams(location.hash.replace(/^#/,''));
      const incoming=(hash.get('token')||'').trim().toLowerCase();
      const tokenKey='carniStoryboardToken:'+location.pathname;
      if(incoming){
        if(!/^[0-9a-f]{64}$/i.test(incoming)) throw new Error('Некорректный ключ доступа');
        sessionStorage.setItem(tokenKey,incoming);
        history.replaceState({},'',location.pathname+'?session='+encodeURIComponent(session));
      }
      const token=sessionStorage.getItem(tokenKey)||'';
      if(!/^[0-9a-f]{64}$/i.test(token)) {
        throw new Error('Ключ доступа отсутствует или устарел. Открой свежую ссылку из Telegram.');
      }

      const gateway='https://qbsovyjwnxmryokekypf.supabase.co/functions/v1/shorts-storyboard-api';
      const response=await fetch(gateway+'/template?session='+encodeURIComponent(session),{cache:'no-store'});
      if(!response.ok) throw new Error('Не удалось загрузить интерфейс: HTTP '+response.status);
      let html=new TextDecoder('utf-8').decode(await response.arrayBuffer());

      const oldBase="const base=()=>location.pathname.replace(/\\/$/,'');";
      const apiBase=gateway+'/s/'+session;
      const newBase='const base=()=>'+JSON.stringify(apiBase)+';';
      if(!html.includes(oldBase)) throw new Error('Версия интерфейса несовместима с оболочкой review.carni.ltd');
      html=html.replace(oldBase,newBase);
      html=html.replace(
        '<head>',
        '<head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src https://*.supabase.co data:; connect-src https://qbsovyjwnxmryokekypf.supabase.co; style-src \'unsafe-inline\'; script-src \'unsafe-inline\'; base-uri \'none\'; form-action \'none\'">'
      );

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      status.className='bad';
      status.textContent=error instanceof Error?error.message:String(error);
    }
  })();
  </script>
</body>
</html>
