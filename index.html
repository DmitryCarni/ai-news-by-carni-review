<body>
  <div id="app"><div class="boot"><b>AI NEWS BY CARNI · REVIEW</b><p id="bootStatus" class="muted">Открываю…</p></div></div>
  <script>
  (async()=>{
    const SUPABASE='https://qbsovyjwnxmryokekypf.supabase.co/functions/v1';
    const gateway=SUPABASE+'/shorts-storyboard-api';
    const portalApi=SUPABASE+'/shorts-review-portal';
    const portalKey='carniReviewPortalToken';
    const pairingIdKey='carniReviewPairingId';
    const pairingCodeKey='carniReviewPairingCode';
    const app=document.getElementById('app');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusName=s=>({editing:'редактирование',approved:'одобрено',preview_ready:'preview готов',preview_requested:'preview в очереди',preview_claimed:'рендерится'})[String(s||'')]||String(s||'—');
    const shortHref=(q,key)=>{
      const sid=encodeURIComponent(q.shortId||'');
      if(key==='text'&&q.textReviewId)return'?editorial='+encodeURIComponent(q.textReviewId)+'&returnShort='+sid;
      if(key==='storyboard'&&q.sessionId)return'?session='+encodeURIComponent(q.sessionId)+'&portal=1&returnShort='+sid;
      if(key==='thumbnail'&&q.sessionId)return'?session='+encodeURIComponent(q.sessionId)+'&portal=1&returnShort='+sid+'&mode=thumbnail';
      if(key==='video'&&q.videoReviewId)return'?video='+encodeURIComponent(q.videoReviewId)+'&returnShort='+sid;
      if(key==='youtube'&&q.sessionId)return'?session='+encodeURIComponent(q.sessionId)+'&portal=1&returnShort='+sid+'&mode=youtube';
      return'';
    };
    const shortDone=(q,key)=>{
      if(key==='text')return q.textStatus==='approved';
      if(key==='storyboard')return q.sessionStatus==='approved';
      if(key==='thumbnail')return!!q.thumbnail?.approved;
      if(key==='video')return q.videoStatus==='approved';
      if(key==='youtube')return String(q.publication?.state||'')==='completed'&&String(q.publication?.privacyStatus||'')==='public';
      return false;
    };
    const shortCurrentKey=q=>{
      if(shortDone(q,'youtube'))return null;
      if(q.action==='text')return'text';
      if(q.action==='storyboard')return'storyboard';
      if(q.action==='video')return'video';
      if(q.stage==='video_approved')return'youtube';
      if(!shortDone(q,'text'))return'text';
      if(!shortDone(q,'storyboard'))return'storyboard';
      if(!shortDone(q,'thumbnail'))return'thumbnail';
      if(!shortDone(q,'video'))return'video';
      return'youtube';
    };
    const shortFlowHtml=(q,activeKey='')=>{
      const current=shortCurrentKey(q);
      const defs=[['text','Текст'],['storyboard','Макет'],['thumbnail','P'],['video','Видео'],['youtube','YouTube']];
      return '<div class="shortFlowBar">'+defs.map(([key,label])=>{
        const href=shortHref(q,key),done=shortDone(q,key),active=activeKey===key,state=done?'done':current===key?'current':'wait';
        const dot=done?'✓':current===key?'●':'○';
        const cls='shortFlowStep '+state+(active?' viewing':'')+(!href?' disabled':'');
        return href?'<a class="'+cls+'" href="'+href+'"><span class="shortFlowDot">'+dot+'</span>'+label+'</a>':'<span class="'+cls+'"><span class="shortFlowDot">'+dot+'</span>'+label+'</span>';
      }).join('')+'</div>';
    };
    async function shortState(shortId,sessionId=''){
      const data=await portalGet('/home');
      return (data.queue||[]).find(x=>(shortId&&String(x.shortId)===String(shortId))||(sessionId&&String(x.sessionId)===String(sessionId)))||null;
    }
    const shortPrimaryHref=q=>{
      const current=shortCurrentKey(q);
      return shortHref(q,current||'youtube')||shortHref(q,'video')||shortHref(q,'storyboard')||shortHref(q,'text')||('?short='+encodeURIComponent(q.shortId||''));
    };
    const queueActionHtml=q=>'<button class="btn '+(q.needsHuman?'primary':'')+'" data-open-href="'+esc(shortPrimaryHref(q))+'">Открыть Short</button>';
    const slotBadge=q=>q.publicationSlot?'<span class="slotBadge '+(q.publicationSlot==='evening'?'evening':'')+'">'+(q.publicationSlot==='evening'?'Вечер':'День')+'</span>':'';

    async function pollPairing(id){
      const state=document.getElementById('pairState');
      while(true){
        await new Promise(r=>setTimeout(r,1800));
        try{
          const r=await fetch(portalApi+'/pair/status?id='+encodeURIComponent(id),{cache:'no-store'});
          const j=await r.json();
          if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
          if(j.status==='claimed'&&/^[0-9a-f]{64}$/i.test(j.token||'')){
            localStorage.setItem(portalKey,String(j.token).toLowerCase());
            localStorage.removeItem(pairingIdKey);
            localStorage.removeItem(pairingCodeKey);
            state.textContent='Готово. Открываю портал…';
            await loadHome();
            return;
          }
          if(j.status==='approved')state.textContent='Подтверждено · создаю доступ…';
          else if(j.status==='expired'){localStorage.removeItem(pairingIdKey);localStorage.removeItem(pairingCodeKey);state.textContent='Код истёк. Нажми «Привязать этот браузер» ещё раз.';return}
        }catch(e){state.textContent='Ошибка проверки: '+(e.message||String(e));return}
      }

      for(const point of curve||[]){

        if(!Number.isFinite(ratio)||!Number.isFinite(value))continue;

    };
    const retentionPct=value=>{

    const retentionComparePalette=['#62d8ff','#ff6fcf','#8df58f','#ffd166','#b18cff','#ff7b72','#7de3c3','#ff9f5a'];

    const analyticsSortValue=(row,key)=>{
      if(key==='title')return String(row?.title||row?.shortId||'').toLocaleLowerCase('ru-RU');
      if(key==='publishedAt'){
        const n=Date.parse(String(row?.publishedAt||''));
        return Number.isFinite(n)?n:null;
      }
      const n=Number(row?.[key]);
      return row?.[key]===null||row?.[key]===undefined||!Number.isFinite(n)?null:n;
    };
    const analyticsSortedVideos=(videos)=>{
      const key=analyticsSort.key,dir=analyticsSort.dir;
      return [...(videos||[])].sort((a,b)=>{
        const av=analyticsSortValue(a,key),bv=analyticsSortValue(b,key);
        const an=av===null||av===undefined||av==='',bn=bv===null||bv===undefined||bv==='';
        if(an&&bn)return String(a?.title||'').localeCompare(String(b?.title||''),'ru');
        if(an)return 1;
        if(bn)return -1;
        let cmp=0;
        if(typeof av==='string'||typeof bv==='string')cmp=String(av).localeCompare(String(bv),'ru',{numeric:true,sensitivity:'base'});
        else cmp=Number(av)-Number(bv);
        if(cmp===0)cmp=String(a?.title||'').localeCompare(String(b?.title||''),'ru');
        return dir==='asc'?cmp:-cmp;
      });
    };
    const analyticsSortHead=(key,label)=>{

      const r24=(data.milestones||[]).filter(x=>Number(x.milestoneHours)===24&&x.views!==null).sort((a,b)=>Number(a.views)-Number(b.views));
      if(r24.length>=2)signals.push({c:'good',t:'24-часовые срезы уже сравнимы',d:'Диапазон сейчас '+aInt(r24[0].views)+'–'+aInt(r24[r24.length-1].views)+' просмотров. Причину разницы пока не приписываем одному фактору.'});
      if(!signals.length)signals.push({c:'good',t:'База уже пригодна для наблюдений',d:'Можно искать повторяющиеся паттерны, но не объявлять причинность без дополнительной проверки.'});

      app.innerHTML='<div class="portal analytics"><div class="top"><div><div class="brand">AI NEWS BY CARNI · ANALYTICS</div><div class="sub">Сравнение Shorts по одинаковому возрасту · сбор каждые '+esc(data.source?.collectorCadenceHours||6)+'ч</div></div><div class="topActions"><input id="studioZipInput" type="file" accept=".zip,application/zip" hidden><button class="btn" id="studioZipImport">Импорт Studio ZIP</button><button class="btn" id="analyticsExport">Скачать датасет JSON</button><button class="btn" id="analyticsHome">На главную</button></div></div>'+

      '<section class="card"><b>Аудитория</b><div class="retentionToolbar">'+(audienceVideos.length?'<select class="retentionSelect" id="audienceVideoSelect">'+audienceOptions+'</select>':'<span class="muted">YouTube ещё не отдал обработанные данные аудитории.</span>')+'</div>'+audiencePanelHtml(audienceVideo)+'</section>'+
      '<section class="card"><b>Кривая удержания</b><div class="retentionToolbar">'+(retentionVideos.length?'<select class="retentionSelect" id="retentionVideoSelect">'+retentionOptions+'</select>':'<span class="muted">YouTube ещё не отдал ни одной кривой.</span>')+'</div>'+(retentionVideo?retentionChartHtml(retentionVideo):'')+'</section>'+
      '<section class="card"><b>Сравнение кривых удержания</b><div class="studioMetricHint">Описательное сравнение без автоматических корреляций и «победителей»: текущая выборка слишком мала для устойчивых выводов о факторах разгона.</div>'+retentionCompareHtml(retentionVideos)+'</section>'+
      '<section class="card"><b>Сравнение по одинаковому возрасту</b><div class="ageBtns">'+[1,3,6,12,24,48,72,168].map(h=>'<button class="ageBtn '+(h===selectedAge?'active':'')+'" data-age="'+h+'">'+h+'ч</button>').join('')+'</div><div class="bars">'+(rows.length?rows.map(r=>'<div class="barRow"><div class="barName" title="'+esc(analyticsName(data,r.videoId,r.shortId))+'">'+esc(analyticsName(data,r.videoId,r.shortId))+'</div><div class="barTrack"><div class="barFill" style="width:'+Math.max(2,Math.round(Number(r.views||0)/max*100))+'%"></div></div><div class="barValue">'+aInt(r.views)+'</div></div>').join(''):'<div class="muted">Для '+selectedAge+'ч ещё нет зрелых срезов.</div>')+'</div></section>'+

      document.getElementById('analyticsHome').onclick=()=>location.href=location.pathname;

          alert('Не удалось импортировать Studio ZIP: '+String(e.message||e));
          setTimeout(()=>{studioZipImport.textContent=before;studioZipImport.disabled=false},1400);

        }catch(e){
          btn.textContent='Ошибка';
          alert('Не удалось выгрузить research dataset: '+String(e.message||e));
          setTimeout(()=>{btn.textContent=before;btn.disabled=false},1200);

      const audienceSelect=document.getElementById('audienceVideoSelect');

      if(retentionSelect)retentionSelect.onchange=()=>{
        analyticsRetentionVideoId=String(retentionSelect.value||'');
        renderAnalytics(data,selectedAge);

      document.querySelectorAll('[data-age]').forEach(n=>n.onclick=()=>renderAnalytics(data,Number(n.dataset.age)));
      document.querySelectorAll('[data-analytics-sort]').forEach(n=>n.onclick=()=>{
        const key=String(n.dataset.analyticsSort||'');
        if(!key)return;
        if(analyticsSort.key===key)analyticsSort={key,dir:analyticsSort.dir==='asc'?'desc':'asc'};

          return raw===''?null:Number(raw);

          shownInFeed:read('shown'),
          stayedToWatchPct:read('stayed'),
          swipedAwayPct:read('swiped'),

            stayedToWatchPct:payload.stayedToWatchPct,
            swipedAwayPct:payload.swipedAwayPct,
            observedAt:saved.observedAt||new Date().toISOString(),
          };
          renderAnalytics(data,selectedAge);
        }catch(e){
          btn.disabled=false;
          btn.textContent='Ошибка';

          setTimeout(()=>{btn.textContent=before;btn.disabled=false},1200);
        }
      });
    }

        '<div class="beats">'+beats.map(b=>{const fb=feedbackByIndex.get(Number(b.index))||{};const locked=!!fb.locked;const hasComment=!!String(fb.comment||'').trim();return '<div class="beatCard '+(locked?'locked ':'')+(hasComment?'commentOpen':'')+'" data-beat-card="'+Number(b.index||0)+'"><div class="beatMain"><div class="beatNo">'+Number(b.index||0)+'</div><div class="beatText">'+esc(b.headline||'')+'</div><div class="beatTools"><button type="button" class="commentToggle '+(hasComment?'active':'')+'" data-beat-toggle="'+Number(b.index||0)+'" '+((feedbackFrozen||locked)?'disabled':'')+'>'+(hasComment?'💬 Есть комментарий':'💬 Комментарий')+'</button><label class="lockLabel"><input type="checkbox" data-beat-lock="'+Number(b.index||0)+'" '+(locked?'checked ':'')+(feedbackFrozen?'disabled':'')+'><strong>🔒 Оставить</strong></label></div></div><div class="beatFeedback"><textarea class="beatComment" data-beat-comment="'+Number(b.index||0)+'" maxlength="1200" placeholder="Что именно не нравится в этой строке…" '+((feedbackFrozen||locked)?'disabled':'')+'>'+esc(fb.comment||'')+'</textarea></div></div>'}).join('')+'</div>'+
        '<div class="editorialTech">'+(r.source?.sectionTitle?'<div class="sourceLine">Источник: '+esc(r.source.sectionTitle)+'</div>':'')+'<div class="hash" title="'+esc(r.candidateSha256||'')+'">SHA · '+esc(String(r.candidateSha256||'').slice(0,12))+'…</div></div>'+
        '<div class="feedbackState '+(feedbackStatus==='failed'?'bad':'')+'" id="feedbackState">'+
          (feedbackStatus==='waiting_for_chat'?'Замечания зафиксированы. Открой назначенный обычный чат и напиши «отредактируй новость».':feedbackStatus==='claimed'?'AI-редактор забрал запрос и работает…':['candidate_written','validated'].includes(feedbackStatus)?'Новая версия проходит автоматические проверки…':feedbackStatus==='queued'?'Старая очередь переработки…':feedbackStatus==='processing'?'Старая переработка текста…':feedbackStatus==='committed'?'Новая версия собрана · доставляю новый TXT…':feedbackStatus==='failed'?'Предыдущая попытка не собралась: '+esc(feedbackError):feedback?'Черновик замечаний восстановлен.':'Комментарии сохраняются автоматически.')+
        '</div>'+
        (r.canDecide?'<div class="editorialActions"><button class="btn rewrite" id="rewriteFeedback">Переделать по замечаниям</button><button class="btn primary" id="sendReviewer">Исправить в Ревьюере</button><button class="btn green" id="approveExact">Одобрить как есть</button></div>':'<div class="decisionState">Это согласование уже обработано.</div>')+
        '<div class="decisionState" id="decisionState"></div></div></div>';

      if(!r.canDecide)return;
      let saveTimer=null,savePromise=null,dirty=false;

      const collect=()=>({
        reviewId:Number(r.reviewId),
        candidateSha256:String(r.candidateSha256||''),
        generalComment:String(document.getElementById('generalFeedback')?.value||'').trim(),
        beats:beats.map(b=>{
          const index=Number(b.index||0);
          return {index,comment:String(document.querySelector('[data-beat-comment="'+index+'"]')?.value||'').trim(),locked:!!document.querySelector('[data-beat-lock="'+index+'"]')?.checked};
        })
      });
      const hasComments=x=>!!x.generalComment||x.beats.some(b=>!!b.comment);
      const setButtons=()=>{
        const payload=collect(),comments=hasComments(payload);
        const rewrite=document.getElementById('rewriteFeedback'),approve=document.getElementById('approveExact'),reviewer=document.getElementById('sendReviewer');
        if(rewrite)rewrite.disabled=feedbackFrozen||!comments;
        if(approve)approve.disabled=feedbackFrozen||comments;
        if(reviewer)reviewer.disabled=feedbackFrozen||comments;
      };
      const saveDraft=async(force=false)=>{
        clearTimeout(saveTimer);saveTimer=null;
        if(feedbackFrozen||(!dirty&&!force))return;
        if(savePromise)return savePromise;
        const payload=collect();dirty=false;
        const state=document.getElementById('feedbackState');
        if(state){state.classList.remove('bad');state.textContent='Сохраняю замечания…'}
        savePromise=portalPost('/editorial/feedback',payload).then(()=>{
          if(state)state.textContent='Замечания сохранены';
        }).catch(e=>{
          dirty=true;
          if(state){state.classList.add('bad');state.textContent='Не удалось сохранить: '+(e.message||String(e))}
          throw e;
        }).finally(()=>{savePromise=null;setButtons()});
        return savePromise;
      };
      const changed=()=>{
        dirty=true;
        setButtons();
        clearTimeout(saveTimer);
        saveTimer=setTimeout(()=>saveDraft(false).catch(()=>{}),650);
      };
      const generalBox=document.getElementById('generalFeedbackBox');
      const generalToggle=document.getElementById('generalFeedbackToggle');
      if(generalToggle&&generalBox)generalToggle.addEventListener('click',()=>{
        generalBox.classList.toggle('open');
        generalToggle.textContent=generalBox.classList.contains('open')?'Свернуть':'💬 Добавить';
        if(generalBox.classList.contains('open'))document.getElementById('generalFeedback')?.focus();
      });
      document.querySelectorAll('[data-beat-toggle]').forEach(btn=>btn.addEventListener('click',()=>{
        const index=Number(btn.dataset.beatToggle);
        const card=document.querySelector('[data-beat-card="'+index+'"]');
        if(!card)return;
        card.classList.toggle('commentOpen');
        btn.classList.toggle('active',card.classList.contains('commentOpen'));
        btn.textContent=card.classList.contains('commentOpen')?'💬 Закрыть':'💬 Комментарий';
        if(card.classList.contains('commentOpen'))document.querySelector('[data-beat-comment="'+index+'"]')?.focus();
      }));
      document.getElementById('generalFeedback').addEventListener('input',changed);
      document.querySelectorAll('[data-beat-comment]').forEach(n=>n.addEventListener('input',()=>{
        const index=Number(n.dataset.beatComment);
        const btn=document.querySelector('[data-beat-toggle="'+index+'"]');
        if(btn){
          const filled=!!String(n.value||'').trim();
          btn.classList.toggle('active',filled);
          if(filled)btn.textContent='💬 Есть комментарий';
        }
        changed();
      }));
      document.querySelectorAll('[data-beat-lock]').forEach(n=>n.addEventListener('change',()=>{
        const index=Number(n.dataset.beatLock),comment=document.querySelector('[data-beat-comment="'+index+'"]'),card=document.querySelector('[data-beat-card="'+index+'"]'),toggle=document.querySelector('[data-beat-toggle="'+index+'"]');
        if(n.checked&&comment){comment.value='';comment.disabled=true;if(card)card.classList.remove('commentOpen');if(toggle){toggle.disabled=true;toggle.classList.remove('active');toggle.textContent='💬 Комментарий'}}else if(comment&&!feedbackFrozen){comment.disabled=false;if(toggle)toggle.disabled=false}
        if(card)card.classList.toggle('locked',n.checked);
        changed();
      }));
      setButtons();

      document.getElementById('rewriteFeedback').onclick=async()=>{
        const payload=collect();
        if(!hasComments(payload))return;
        if(!confirm('Переделать эту exact-версию текста по замечаниям?\n\nЗакреплённые строки останутся без изменений. После полного редакционного preflight появится новый TXT.'))return;
        const buttons=['rewriteFeedback','approveExact','sendReviewer'].map(id=>document.getElementById(id));buttons.forEach(b=>{if(b)b.disabled=true});
        const state=document.getElementById('feedbackState');if(state)state.textContent='Фиксирую замечания для обычного AI-редактора…';
        try{
          await saveDraft(true);
          const result=await portalPost('/editorial/rewrite',payload);
          if(state)state.textContent='Запрос #'+result.requestId+' сохранён. Открой назначенный обычный чат и напиши «отредактируй новость».';
          setTimeout(()=>{location.href=location.pathname},1200);
        }catch(e){
          buttons.forEach(b=>{if(b)b.disabled=false});
          if(state){state.classList.add('bad');state.textContent=e.message||String(e)}
          setButtons();
        }
      };

      const act=async(decision)=>{
        const approve=decision==='approve';
        const payload=collect();
        if(hasComments(payload)){document.getElementById('decisionState').textContent='Есть замечания — сначала нажми «Переделать по замечаниям» или очисти их.';return}
        const message=approve?'Одобрить именно эту версию текста?':'Передать именно эту версию текста в Ревьюер?';
        if(!confirm(message))return;
        const buttons=[document.getElementById('approveExact'),document.getElementById('sendReviewer'),document.getElementById('rewriteFeedback')];
        buttons.forEach(b=>{if(b)b.disabled=true});
        const state=document.getElementById('decisionState');if(state)state.textContent='Сохраняю решение…';
        try{
          await portalPost('/editorial/decision',{reviewId:Number(r.reviewId),decision,candidateSha256:String(r.candidateSha256||'')});
          if(state)state.textContent=approve?'Одобрено. Производственный путь запущен.':'Передано в Ревьюер.';
          setTimeout(()=>{location.href=location.pathname},900);
        }catch(e){
          buttons.forEach(b=>{if(b)b.disabled=false});
          if(state){state.classList.add('bad');state.textContent=e.message||String(e)}
          setButtons();
        }
      };
      document.getElementById('approveExact').onclick=()=>act('approve');
      document.getElementById('sendReviewer').onclick=()=>act('reviewer');
    }

    async function loadVideo(reviewId){

      const r=data.review||{};
      const requestedId=Number(reviewId||0);
      const actualId=Number(r.reviewId||0);
      if(actualId>0&&actualId!==requestedId){
        const params=new URLSearchParams(location.search);
        params.set('video',String(actualId));
        history.replaceState({},'',location.pathname+'?'+params.toString());
      }
      const requestedReturnShort=(new URLSearchParams(location.search).get('returnShort')||String(r.shortId||'')).trim();

      const flowState=await shortState(requestedReturnShort||String(r.shortId||''));

      const renderer=String(r.storyboard?.rendererCommit||'');
      const storyboardSessionId=String(r.storyboard?.sessionId||'');

      const timingSummary=timingBeats.length
        ?timingBeats.map(x=>String(x.index)+': '+timingFmt(x.seconds)).join(' · ')+' · ролик '+timingFmt(r.storyboard?.durationSeconds||0)
        :'';
      const staleNotice=Number(r.resolvedFromStaleReviewId||0)>0
        ?'<div class="workspaceNeed current"><b>Обновлено:</b> старая ссылка VID-'+String(r.resolvedFromStaleReviewId).padStart(4,'0')+' автоматически заменена на актуальный '+esc(vidLabel)+'.</div>'
        :'';
      app.innerHTML='<div class="videoReview"><div class="editorialHead"><div><div class="brand">AI NEWS BY CARNI · REVIEW</div><div class="sub">Exact MP4 · финальное согласование</div></div><a class="btn" href="'+returnHref+'">← К очереди</a></div>'+flowHtml+staleNotice+
        '<div class="card"><div class="videoBox"><div><video class="videoPlayer" controls playsinline preload="metadata" src="'+esc(r.videoUrl||'')+'"></video><div class="videoNote">Защищённая ссылка живёт '+Math.round(Number(r.videoUrlExpiresInSeconds||0)/60)+' мин. Решение привязывается не к ссылке, а к exact SHA-256 файла.</div></div>'+

        (r.publishBundle?.present?'<div class="identityRow"><div class="identityLabel">Publish bundle SHA-256</div><div class="identityValue">'+esc(bundleSha)+'</div></div>':'<div class="identityRow"><div class="identityLabel">Publish bundle</div><div class="identityValue bad">Отсутствует — публикация после approval будет заблокирована</div></div>')+
        (r.storyboard?.revisionId?'<div class="identityRow"><div class="identityLabel">Storyboard</div><div class="identityValue">revision '+esc(r.storyboard.revisionId)+' · '+esc(storyboardHash)+'<br>renderer '+esc(renderer)+'</div></div>':'')+
        (timingSummary?'<div class="identityRow"><div class="identityLabel">Тайминги кадров</div><div class="identityValue">'+esc(timingSummary)+'</div></div>':'')+
        '<div class="identityRow"><div class="identityLabel">Просмотр</div><div>Web остаётся точкой решения; exact MP4 также отправляется в Telegram для быстрого просмотра.</div></div>'+
        '<div class="identityRow"><div class="identityLabel">YouTube после approval</div><div>'+esc(r.youtube?.releaseMode||'—')+' · initial '+esc(r.youtube?.privacyStatus||'private')+'</div></div></div></div>'+

    const workspaceTextStatus=q=>({pending:'Ждёт решения',approved:'Одобрен',rejected:'Отклонён',superseded:'Заменён'})[String(q.textStatus||'')]||String(q.textStatus||'Нет данных');

    const workspaceVideoStatus=q=>!q.videoReviewId?'Ещё не готово':q.videoStatus==='pending'?'Ждёт решения':q.videoStatus==='approved'?'Одобрено':q.videoStatus==='rejected'?'Нужны правки':String(q.videoStatus||'—');

      const state=String(q.publication?.state||''),privacy=String(q.publication?.privacyStatus||'');
      if(state==='completed'&&privacy==='public')return'Опубликовано';
      if(q.youtubeVideoId&&privacy==='private')return'Загружено PRIVATE';
      if(q.videoStatus==='approved')return'Публикация';
      return q.youtubeVideoId?'Видео создано':'Ещё не дошло';

      const storyboardDone=q.sessionStatus==='approved';

      const thumbActions=q.sessionId?'<button class="btn" data-open-session-url="'+esc(workspaceSessionHref(q,'thumbnail'))+'">Открыть P</button>':'<button class="btn" disabled>Ещё нет</button>';
      const videoActions=q.videoReviewId?'<button class="btn" data-open-video="'+Number(q.videoReviewId)+'" data-return-short="'+esc(q.shortId||'')+'">Открыть exact MP4</button>':'<button class="btn" disabled>Ещё нет</button>';

      app.innerHTML='<div class="workspace">'+
        '<div class="workspaceHero"><div><div class="brand">AI NEWS BY CARNI · SHORT</div><h1 class="workspaceTitle">'+esc(q.title||q.shortId)+'</h1><div class="sub">'+esc(q.reportDate||'')+(q.publicationSlot?' · '+esc(q.publicationSlot==='evening'?'вечер':'день'):'')+'</div><div class="workspaceState">'+esc(q.stageLabel||q.stage||'—')+'</div></div><button class="btn" id="workspaceHome">← К очереди</button></div>'+
        '<div class="workspaceNeed '+(youtubeDone?'done':q.needsHuman?'current':'wait')+'"><b>'+(youtubeDone?'✓ Short завершён:':'Сейчас:')+'</b> '+esc(youtubeDone?'опубликован и вся цепочка закрыта':q.needsHuman?'нужно твоё решение — '+(q.stageLabel||'открой текущий этап'):(q.stageLabel||'автоматика работает'))+'</div>'+
        '<div class="workspaceGrid">'+
          workspaceStep('1 · Текст',workspaceTextStatus(q),'TXT-'+String(q.textReviewId||0).padStart(4,'0')+' · формулировки, комментарии и редактура',textActions,cls('text'))+
          workspaceStep('2 · Макет и тайминги',workspaceStoryboardStatus(q),q.sessionId?'Storyboard session готова · revision '+esc(q.latestRevisionId||'—'):'Появится после одобрения текста',storyboardActions,cls('storyboard'))+
          workspaceStep('3 · Превью P',workspaceThumbStatus(q),q.thumbnail?.approvedSha256?'Exact PNG · '+esc(String(q.thumbnail.approvedSha256).slice(0,12))+'…':'Генерация, текст на превью и утверждение exact PNG',thumbActions,cls('thumbnail'))+
          workspaceStep('4 · Видео',workspaceVideoStatus(q),q.videoReviewId?'VID-'+String(q.videoReviewId).padStart(4,'0')+' · exact MP4':'Появится после рендера/QC',videoActions,cls('video'))+
          workspaceStep('5 · YouTube и публикация',workspaceYoutubeStatus(q),q.youtubeVideoId?'YouTube · '+esc(q.youtubeVideoId):'Название, описание, режим выпуска и публикация',youtubeActions,cls('youtube'))+
          '<section class="workspaceStep workspaceWide '+(youtubeDone?'done':'wait')+'"><div class="workspaceStepHead"><div class="workspaceStepTitle">Цепочка Short</div><div class="workspaceStepStatus">'+(youtubeDone?'✓ завершена':'в работе')+'</div></div><div class="workspaceStepMeta">Текст → Макет → P → exact MP4 → YouTube. Эта страница собирает каноническое состояние из Supabase после каждого обновления.</div><div class="workspaceIds">shortId '+esc(q.shortId)+' · TXT '+esc(q.textReviewId||'—')+' · session '+esc(q.sessionId||'—')+' · VID '+esc(q.videoReviewId||'—')+'</div></section>'+
        '</div></div>';

      document.getElementById('workspaceHome').onclick=()=>location.href=location.pathname;
      document.querySelectorAll('[data-open-editorial]').forEach(n=>n.onclick=()=>{const rs=n.dataset.returnShort||'';location.href='?editorial='+encodeURIComponent(n.dataset.openEditorial)+(rs?'&returnShort='+encodeURIComponent(rs):'')});
      document.querySelectorAll('[data-open-video]').forEach(n=>n.onclick=()=>{const rs=n.dataset.returnShort||'';location.href='?video='+encodeURIComponent(n.dataset.openVideo)+(rs?'&returnShort='+encodeURIComponent(rs):'')});
      document.querySelectorAll('[data-open-session-url]').forEach(n=>n.onclick=()=>location.href=String(n.dataset.openSessionUrl||''));
    }

    async function loadHome(){
      const token=localStorage.getItem(portalKey)||'';
      if(!/^[0-9a-f]{64}$/i.test(token)){
        const pairingId=localStorage.getItem(pairingIdKey)||'';
        const pairingCode=localStorage.getItem(pairingCodeKey)||'';
        if(/^[0-9a-f-]{36}$/i.test(pairingId)){
          renderPair();
          document.getElementById('pairIdle').classList.add('hidden');
          document.getElementById('pairWait').classList.remove('hidden');
          document.getElementById('pairCode').textContent=/^[0-9]{6}$/.test(pairingCode)?pairingCode:'••••••';
          document.getElementById('pairState').textContent='Продолжаю уже начатую привязку…';
          pollPairing(pairingId);
          return;
        }
        renderPair();return
      }
      let r,j;
      try{
        r=await fetch(portalApi+'/home',{headers:{'x-review-portal-token':token},cache:'no-store'});
        j=await r.json();
      }catch(e){app.innerHTML='<div class="boot bad">Не удалось открыть портал: '+esc(e.message||String(e))+'</div>';return}
      if(r.status===401){localStorage.removeItem(portalKey);renderPair();return}
      if(!r.ok||!j.ok){app.innerHTML='<div class="boot bad">Ошибка портала: '+esc(j.error||('HTTP '+r.status))+'</div>';return}

      const queue=Array.isArray(j.queue)?j.queue:[];
      const analyticsHref='?view=analytics';
      const now=Date.now();
      const ageHours=q=>Math.max(0,(now-new Date(q.updatedAt||0).getTime())/3600000);
      const terminal=new Set(['published','video_rejected','text_rejected']);
      const current=queue.filter(q=>{
        if(ageHours(q)>72)return false;
        return !terminal.has(String(q.stage||''));
      });
      const recentDone=queue.find(q=>q.stage==='published')||null;
      const hidden=queue.filter(q=>!current.includes(q)).slice(0,12);

      app.innerHTML='<div class="portal"><div class="top"><div><div class="brand">AI NEWS BY CARNI · REVIEW</div><div class="sub">Контрольный центр Shorts</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn green" id="openAnalytics">Аналитика</button><button class="btn" id="disconnect">Отвязать браузер</button></div></div>'+
      '<div class="card"><b>Сейчас</b><div class="sub">Только то, что требует решения или ещё не закончено.</div><div class="queue">'+(
        current.length?current.map(queueCard).join(''):'<div class="quiet">Ничего не ждёт твоего решения.</div>'
      )+'</div>'+(
        recentDone?'<div class="doneLine">Последний выпуск · '+esc(recentDone.title||recentDone.shortId)+' · опубликован</div>':''
      )+'</div>'+(
        hidden.length?'<details class="archive"><summary>Показать старые и завершённые · '+hidden.length+'</summary><div class="queue">'+hidden.map(queueCard).join('')+'</div></details>':''
      )+'</div>';
      document.getElementById('disconnect').onclick=()=>{if(confirm('Точно отвязать этот браузер от Reviewer? Для повторного доступа потребуется новая привязка.')){localStorage.removeItem(portalKey);localStorage.removeItem(pairingIdKey);localStorage.removeItem(pairingCodeKey);location.href=location.pathname}};
      document.getElementById('openAnalytics').onclick=()=>location.href=analyticsHref;
      document.querySelectorAll('[data-open-href]').forEach(n=>n.onclick=()=>{location.href=String(n.dataset.openHref||location.pathname)});
      document.querySelectorAll('[data-open-session]').forEach(n=>n.onclick=()=>{location.href='?session='+encodeURIComponent(n.dataset.openSession)+'&portal=1'});
      document.querySelectorAll('[data-open-editorial]').forEach(n=>n.onclick=()=>{location.href='?editorial='+encodeURIComponent(n.dataset.openEditorial)});
      document.querySelectorAll('[data-open-video]').forEach(n=>n.onclick=()=>{location.href='?video='+encodeURIComponent(n.dataset.openVideo)});
    }

    try{
      const query=new URLSearchParams(location.search);
      if(query.get('view')==='analytics')await loadAnalytics();
      else if(query.get('short'))await loadShortWorkspace(query.get('short'));
      else if(query.get('editorial'))await loadEditorial(query.get('editorial'));
      else if(query.get('video'))await loadVideo(query.get('video'));
      else if(query.get('session'))await openSession(query);
      else await loadHome();
    }catch(error){
      app.innerHTML='<div class="boot"><b>AI NEWS BY CARNI · REVIEW</b><p class="bad">'+esc(error instanceof Error?error.message:String(error))+'</p><p><a class="btn" href="'+location.pathname+'">На главную</a></p></div>';
    }
  })();
  </script>
</body>
</html>
